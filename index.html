<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <!-- Google analytics-->
    <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-K5K6B4K3"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
</script>
    <!-- end Google analytics-->
    <title>دردشة الأصدقاء | المجموعات والمحادثات</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 1. شاشة تسجيل الدخول -->
    <div id="auth-screen" class="screen active">
        <div class="auth-card">
            <div class="wa-logo">
                <svg viewBox="0 0 24 24" width="44" height="44" fill="currentColor">
                    <path d="M12 2C6.48 2 2 6.03 2 11c0 2.39 1.05 4.56 2.76 6.16L3.6 21.4l4.49-1.18C9.32 20.72 10.63 21 12 21c5.52 0 10-4.03 10-9s-4.48-10-10-10zm0 17c-1.22 0-2.4-.26-3.47-.73l-.49-.22-2.66.7.71-2.58-.32-.48C4.63 14.5 4 12.82 4 11c0-3.86 3.59-7 8-7s8 3.14 8 7-3.59 7-8 7z"/>
                </svg>
            </div>
            <h1>دردشة الأصدقاء</h1>
            <p>سجّل الدخول للمتابعة إلى مساحتك الخاصة</p>

            <input type="email" id="auth-email" placeholder="البريد الإلكتروني..." autocomplete="email">
            <input type="password" id="auth-password" placeholder="كلمة المرور..." autocomplete="current-password">

            <div class="auth-email-actions">
                <button type="button" id="email-login-btn" class="primary-btn">تسجيل الدخول</button>
                <button type="button" id="email-signup-btn" class="secondary-btn">حساب جديد</button>
            </div>

            <div class="auth-divider"><span>أو المتابعة عبر</span></div>

            <button type="button" id="google-login-btn" class="provider-btn google-btn">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                    <path d="M21.35 11.1h-9.17v2.73h6.51c-.33 3.81-3.5 5.44-6.5 5.44C8.36 19.27 5 16.25 5 12c0-4.1 3.2-7.27 7.2-7.27 3.09 0 4.9 1.97 4.9 1.97L19 4.72S16.56 2 12.1 2C6.42 2 2.03 6.8 2.03 12c0 5.05 4.13 10 10.22 10 5.35 0 9.25-3.67 9.25-9.09 0-1.15-.15-1.81-.15-1.81z"/>
                </svg>
                <span>المتابعة باستخدام Google</span>
            </button>

            <button type="button" id="github-login-btn" class="provider-btn github-btn">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                    <path d="M12 2A10 10 0 0 0 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2z"/>
                </svg>
                <span>المتابعة باستخدام GitHub</span>
            </button>

            <p id="auth-error" class="error-text"></p>
        </div>
    </div>

    <!-- 2. شاشة إعداد اسم المستخدم والرمز الخاص -->
    <div id="profile-screen" class="screen">
        <div class="auth-card">
            <div class="wa-logo">
                <svg viewBox="0 0 24 24" width="42" height="42" fill="currentColor">
                    <path d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5z"/>
                </svg>
            </div>
            <h2>إعداد ملفك الشخصي</h2>
            <p>أضف اسم المستخدم ورمزك الخاص الذي سيحتاجه الآخرون لمراسلتك</p>

            <input type="text" id="setup-username-input" placeholder="اسم المستخدم..." maxlength="25" autocomplete="off">
            <input type="password" id="setup-pin-input" placeholder="رمزك الخاص لمراسلتك (مثال: 1234)..." maxlength="12" autocomplete="off">

            <button type="button" id="save-profile-btn" class="primary-btn">حفظ والدخول</button>
            <p id="profile-error" class="error-text"></p>
        </div>
    </div>

    <!-- 3. شاشة التطبيق الرئيسية -->
    <div id="chat-screen" class="screen">
        <div class="wa-app">
            <!-- القائمة الجانبية -->
            <aside class="sidebar">
                <header class="wa-header">
                    <div class="user-profile">
                        <div class="avatar" id="user-avatar">U</div>
                        <div>
                            <h3 id="sidebar-username">---</h3>
                            <div class="profile-sub-actions">
                                <button type="button" id="edit-profile-btn" class="link-btn">تعديل الملف</button>
                                <span>•</span>
                                <button type="button" id="copy-pin-btn" class="link-btn" title="نسخ رمزك الخاص">نسخ رمزي</button>
                            </div>
                        </div>
                    </div>

                    <div class="header-actions">
                        <button type="button" id="sound-toggle" class="icon-btn" title="تفعيل/كتم الصوت والإشعارات">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                                <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
                            </svg>
                        </button>
                        <button type="button" id="theme-toggle" class="icon-btn" title="تبديل المظهر">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                                <path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/>
                            </svg>
                        </button>
                        <button type="button" id="logout-btn" class="icon-btn danger-icon" title="تسجيل خروج">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                                <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
                            </svg>
                        </button>
                    </div>
                </header>

                <!-- شريط البحث -->
                <div class="search-box">
                    <div class="search-input-wrap">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                            <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                        </svg>
                        <input type="text" id="search-input" placeholder="بحث في المجموعات أو المحادثات..." autocomplete="off">
                    </div>
                </div>
                <!-- إدارة المجموعات والمحادثات -->
                <div class="create-box">
                    <input type="text" id="new-room-input" placeholder="اسم المجموعة أو اسم المستخدم..." autocomplete="off">
                    <input type="password" id="new-room-pass" placeholder="رمز المجموعة أو الرمز الخاص للمستخدم" autocomplete="off">
                    <div class="group-action-btns">
                        <button type="button" id="create-room-btn" class="group-btn primary-group-btn">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                                <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                            </svg>
                            <span>إنشاء مجموعة</span>
                        </button>
                        <button type="button" id="join-room-btn" class="group-btn secondary-group-btn">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                                <path d="M11 7L9.6 8.4l2.6 2.6H2v2h10.2l-2.6 2.6L11 17l5-5-5-5zm9 12h-8v2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-8v2h8v14z"/>
                            </svg>
                            <span>الدخول إلى مجموعة</span>
                        </button>
                    </div>
                    <button type="button" id="join-dm-btn" class="group-btn secondary-group-btn" style="width:100%;">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                            <path d="M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/>
                        </svg>
                        <span>الدخول إلى محادثة (بالاسم والرمز)</span>
                    </button>
                </div>


                <!-- التبويبات -->
                <div class="tabs-bar">
                    <button type="button" id="tab-rooms-btn" class="tab-btn active">المجموعات</button>
                    <button type="button" id="tab-users-btn" class="tab-btn">المحادثات</button>
                </div>

                <div id="rooms-list" class="list-panel active"></div>
                <div id="users-list" class="list-panel"></div>
            </aside>

            <!-- منطقة المحادثة -->
            <section class="chat-panel">
                <header class="wa-header chat-top-header">
                    <div class="chat-room-info">
                        <button type="button" id="back-to-rooms-btn" class="back-btn" title="رجوع">
                            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                                <path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/>
                            </svg>
                        </button>
                        <div class="room-avatar" id="chat-avatar">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                                <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
                            </svg>
                        </div>
                        <div>
                            <h3 id="current-chat-title">اختر مجموعة أو محادثة</h3>
                            <span id="current-chat-subtitle" class="chat-subtitle">محادثاتك خاصة ومحمية</span>
                        </div>
                    </div>
                </header>

                <!-- صندوق الرسائل -->
                <main id="messages-container" class="messages-container"></main>

                <button type="button" id="scroll-bottom-btn" class="scroll-bottom-btn" hidden title="النزول لآخر رسالة">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                        <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/>
                    </svg>
                </button>

                <!-- مربع إرسال الرسائل -->
                <form id="message-form" class="message-form">
                    <button type="button" id="image-btn" class="media-btn" title="إرسال صورة">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                            <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>
                        </svg>
                    </button>
                    <input type="file" id="image-input" accept="image/*" hidden>

                    <button type="button" id="mic-btn" class="media-btn" title="رسالة صوتية">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/>
                        </svg>
                    </button>
                    <span id="recording-indicator" class="recording-indicator" hidden>● جاري التسجيل...</span>

                    <input type="text" id="message-input" placeholder="اكتب رسالة..." autocomplete="off">
                    <button type="submit" id="send-btn" class="send-btn" title="إرسال">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                        </svg>
                    </button>
                </form>
            </section>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="main.js"></script>
</body>
</html>
