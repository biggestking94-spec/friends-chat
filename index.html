<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساحتنا الخاصة | دردشة الأصدقاء</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen" class="screen active">
        <div class="login-card">
            <h1>دردشة الأصدقاء 💬</h1>
            <p>أدخل اسمك والرمز السري للدخول إلى المساحة الخاصة</p>

            <input type="text" id="username-input" placeholder="اكتب اسمك هنا..." autocomplete="off">
            <input type="password" id="room-code-input" placeholder="الرمز السري للدخول..." autocomplete="off">

            <button type="button" id="join-btn">دخول</button>
            <p id="login-error" class="error-text"></p>
        </div>
    </div>

    <!-- شاشة الدردشة -->
    <div id="chat-screen" class="screen">
        <!-- رأس الدردشة -->
        <header class="chat-header">
            <div class="header-info">
                <h2>غرفة الأصدقاء 💬</h2>
                <span id="current-user-badge" class="user-badge">متصل كـ: ---</span>
            </div>

            <div class="header-actions">
                <button type="button" id="sound-toggle" class="icon-btn" title="تفعيل/كتم الصوت">🔔</button>
                <button type="button" id="theme-toggle" class="icon-btn" title="الوضع الليلي/النهاري">🌗</button>
                <button type="button" id="logout-btn" class="logout-btn">خروج</button>
            </div>
        </header>

        <!-- شريط غرف المراسلة -->
        <div class="rooms-bar">
            <div id="rooms-list" class="rooms-list"></div>
            <div class="add-room-box">
                <input type="text" id="new-room-input" placeholder="اسم الغرفة..." autocomplete="off">
                <input type="password" id="new-room-pass" placeholder="رمز الغرفة (اختياري)" autocomplete="off">
                <button type="button" id="add-room-btn" title="إضافة غرفة">+</button>
            </div>
        </div>

        <!-- شريط المتصلين حالياً -->
        <div class="online-bar">
            <span class="online-label">🟢 متصل الآن:</span>
            <div id="online-users-list" class="online-users-list"></div>
        </div>

        <!-- منطقة الرسائل -->
        <main id="messages-container" class="messages-container"></main>

        <!-- شريط إرسال الرسائل والصور -->
        <form id="message-form" class="message-form">
            <button type="button" id="image-btn" class="image-btn" title="إرسال صورة">📷</button>
            <input type="file" id="image-input" accept="image/*" hidden>

            <input type="text" id="message-input" placeholder="اكتب رسالتك هنا..." autocomplete="off">
            <button type="submit" id="send-btn" class="send-btn">إرسال ➤</button>
        </form>
    </div>

    <!-- مكتبات Firebase العادية -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="main.js"></script>
</body>
</html>
